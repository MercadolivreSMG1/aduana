<style>
:root{
  --ink:#1A1D29; --ink2:#474D5E; --mut:#79808F; --mut2:#A4AAB9;
  --glass:rgba(255,255,255,.72); --glassS:rgba(255,255,255,.86); --glass2:rgba(255,255,255,.55);
  --gbd:rgba(255,255,255,.75); --gbd2:rgba(26,29,41,.07); --bd:rgba(26,29,41,.08);
  --ylw:#FFD91A; --ylw2:#FFC400; --gold:#9A7712;
  --blu:#3B7BFF; --bluS:rgba(59,123,255,.12);
  --grn:#14A85C; --grnS:rgba(20,168,92,.13);
  --amb:#F0910D; --ambS:rgba(240,145,13,.14);
  --red:#E64A54; --redS:rgba(230,74,84,.13);
  --sev:#E64A54; --cri:#EE7A1E; --ate:#D6A209; --otm:#14A85C;
  --sh1:0 2px 10px rgba(40,52,95,.06);
  --sh2:0 12px 34px rgba(40,52,95,.11);
  --sh3:0 22px 54px rgba(40,52,95,.17);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#EAEDF6;color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
#root{min-height:100vh}
.gk{font-family:'Space Grotesk',sans-serif}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1300px;margin:0 auto;padding:0 26px}

/* ===== AURORA ===== */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.ab{position:absolute;border-radius:50%;filter:blur(96px);opacity:.85;mix-blend-mode:normal}
.a1{width:620px;height:620px;background:radial-gradient(circle,rgba(59,123,255,.5),transparent 68%);top:-240px;right:-120px;animation:driftA 26s ease-in-out infinite}
.a2{width:560px;height:560px;background:radial-gradient(circle,rgba(255,217,26,.5),transparent 66%);bottom:-260px;left:-140px;animation:driftB 30s ease-in-out infinite}
.a3{width:520px;height:520px;background:radial-gradient(circle,rgba(101,224,178,.42),transparent 66%);top:34%;left:-200px;animation:driftA 34s ease-in-out infinite;animation-delay:-8s}
.a4{width:480px;height:480px;background:radial-gradient(circle,rgba(190,160,255,.4),transparent 66%);top:-160px;left:38%;animation:driftB 28s ease-in-out infinite;animation-delay:-14s}
@keyframes driftA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,50px) scale(1.14)}}
@keyframes driftB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-40px) scale(1.1)}}
.topbar,main,.foot{position:relative;z-index:1}

/* ===== ANIM ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ringGlow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 9px rgba(230,74,84,.55))}}
@keyframes livedot{0%{box-shadow:0 0 0 0 rgba(20,168,92,.5)}70%{box-shadow:0 0 0 7px rgba(20,168,92,0)}100%{box-shadow:0 0 0 0 rgba(20,168,92,0)}}
@keyframes pop{0%{transform:scale(.35);opacity:0}70%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
@keyframes sheen{0%{background-position:220% 0}100%{background-position:-220% 0}}
@keyframes contentIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.55);opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flashDone{0%{background:rgba(20,168,92,.2)}100%{background:transparent}}
@keyframes flashUpd{0%{background:rgba(59,123,255,.16)}100%{background:transparent}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.view{animation:contentIn .42s ease both}
.livep{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px;vertical-align:middle;animation:dotPulse 1.5s ease-in-out infinite}

/* ===== TOPBAR ===== */
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.55);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--gbd);animation:slideDown .45s ease both}
.tb-in{display:flex;align-items:center;gap:13px;padding:13px 0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ylw),var(--ylw2));display:grid;place-items:center;box-shadow:0 8px 22px rgba(255,200,0,.5);position:relative;overflow:hidden;animation:floaty 5s ease-in-out infinite}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.8) 50%,transparent 58%);background-size:250% 100%;animation:sheen 5s ease-in-out infinite}
.brand h1{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-.5px;line-height:1}
.brand p{color:var(--mut);font-size:11.5px;margin-top:3px;font-weight:500}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:11px}
.refresh{width:36px;height:36px;border-radius:11px;background:var(--glassS);border:1px solid var(--gbd);box-shadow:var(--sh1);display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:.18s;backdrop-filter:blur(8px)}
.refresh:hover{color:var(--ink);transform:translateY(-2px);box-shadow:var(--sh2)}
.refresh:active{transform:scale(.93)}
.refresh.spin svg{animation:spin .8s linear infinite}
.src-tag{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);background:var(--glassS);border:1px solid var(--gbd);padding:7px 13px;border-radius:30px;box-shadow:var(--sh1);font-weight:600;backdrop-filter:blur(8px)}
.src-tag b{color:var(--ink)} .src-tag.off{color:var(--amb)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:livedot 2s infinite}
.livedot.off{background:var(--amb);animation:none}
.clock{font-family:'JetBrains Mono';font-weight:600;font-size:15px;letter-spacing:.4px;color:var(--ink)}

/* ===== TABS ===== */
.tabsrow{display:flex;align-items:center;gap:14px;margin:24px 0 20px;flex-wrap:wrap;animation:fadeUp .5s both}
.seg{display:inline-flex;position:relative;background:var(--glass);border:1px solid var(--gbd);border-radius:14px;padding:5px;box-shadow:var(--sh1);backdrop-filter:blur(12px)}
.seg-hl{position:absolute;top:5px;bottom:5px;background:linear-gradient(135deg,#22252F,#3A3F4E);border-radius:11px;overflow:hidden;box-shadow:0 6px 16px rgba(26,29,41,.28);transition:left .36s cubic-bezier(.34,1.3,.5,1),width .36s cubic-bezier(.34,1.3,.5,1)}
.seg-hl::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.2) 50%,transparent 56%);background-size:250% 100%;animation:sheen 5.5s ease-in-out infinite}
.seg button{position:relative;z-index:1;border:0;background:transparent;font-family:'Inter';font-weight:600;font-size:13.5px;color:var(--ink2);padding:9px 16px;border-radius:11px;cursor:pointer;transition:color .25s,background .3s;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.seg button:hover:not(.on){color:var(--ink)}
.seg button.on{color:#fff;background:linear-gradient(135deg,#22252F,#3A3F4E);box-shadow:0 6px 16px rgba(26,29,41,.28)}
.seg button.on::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 44%,rgba(255,255,255,.2) 50%,transparent 56%);background-size:250% 100%;animation:sheen 5.5s ease-in-out infinite;pointer-events:none}
.seg .cnt{font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:rgba(26,29,41,.1)}
.seg button.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.tabsrow .grow{flex:1}
.upd{font-size:11.5px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--gbd);padding:6px 12px;border-radius:20px;box-shadow:var(--sh1);backdrop-filter:blur(8px)}

/* ===== KPI CARDS ===== */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;animation:fadeUp .5s .05s both}
.stat{position:relative;border-radius:18px;padding:18px;border:1px solid var(--gbd);box-shadow:var(--sh1);overflow:hidden;backdrop-filter:blur(14px);transition:transform .25s,box-shadow .25s;animation:rise .5s both}
.stat:hover{transform:translateY(-5px);box-shadow:var(--sh2)}
.stat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;opacity:.9}
.sico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;margin-bottom:13px;animation:pop .55s both}
.slab{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:700}
.stat .val{font-family:'Space Grotesk';font-weight:700;font-size:34px;line-height:1;margin-top:7px;letter-spacing:-1.2px}
.stat .val small{font-size:15px;font-weight:600;color:var(--mut);margin-left:2px;letter-spacing:0}
.stat .sub{font-size:11px;color:var(--mut2);margin-top:6px;font-weight:500}
.s-tot{background:linear-gradient(155deg,var(--bluS),var(--glass) 60%)} .s-tot::after{background:var(--blu)} .s-tot .sico{background:var(--bluS);color:var(--blu)}
.s-run{background:linear-gradient(155deg,var(--ambS),var(--glass) 60%)} .s-run::after{background:var(--amb)} .s-run .sico{background:var(--ambS);color:var(--amb)} .s-run .val{color:var(--amb)}
.s-done{background:linear-gradient(155deg,var(--grnS),var(--glass) 60%)} .s-done::after{background:var(--grn)} .s-done .sico{background:var(--grnS);color:var(--grn)} .s-done .val{color:var(--grn)}
.s-avg{background:linear-gradient(155deg,rgba(255,217,26,.16),var(--glass) 60%)} .s-avg::after{background:var(--ylw2)} .s-avg .sico{background:rgba(255,217,26,.2);color:var(--gold)} .s-avg .val{color:var(--gold)}
.s-crit{background:linear-gradient(155deg,var(--redS),var(--glass) 60%)} .s-crit::after{background:var(--red)} .s-crit .sico{background:var(--redS);color:var(--red)} .s-crit .val{color:var(--red)}
.stat:nth-child(1) .sico{animation-delay:.1s}.stat:nth-child(2) .sico{animation-delay:.18s}.stat:nth-child(3) .sico{animation-delay:.26s}.stat:nth-child(4) .sico{animation-delay:.34s}.stat:nth-child(5) .sico{animation-delay:.42s}
.stat:nth-child(2){animation-delay:.06s}.stat:nth-child(3){animation-delay:.12s}.stat:nth-child(4){animation-delay:.18s}.stat:nth-child(5){animation-delay:.24s}

/* ===== CONTROLS ===== */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0;animation:fadeUp .5s .1s both}
.cyc{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--glass);border:1px solid var(--gbd);color:var(--ink2);font-weight:600;font-size:13px;padding:8px 15px;border-radius:12px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:6px;box-shadow:var(--sh1);backdrop-filter:blur(8px)}
.chip:hover{color:var(--ink);transform:translateY(-2px);box-shadow:var(--sh2)}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,#22252F,#3A3F4E);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(26,29,41,.28)}
.chip .n{font-size:11px;font-weight:700;opacity:.55} .chip.on .n{opacity:.75}
.spacer{margin-left:auto}
.demo-tgl{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--mut);cursor:pointer;user-select:none;background:var(--glass);border:1px solid var(--gbd);padding:8px 13px;border-radius:12px;box-shadow:var(--sh1);transition:.2s;backdrop-filter:blur(8px)}
.demo-tgl.on{color:var(--amb)}
.sw{width:36px;height:21px;border-radius:20px;background:rgba(26,29,41,.18);position:relative;transition:.25s}
.sw::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.25s cubic-bezier(.34,1.4,.5,1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.demo-tgl.on .sw{background:var(--amb)} .demo-tgl.on .sw::after{left:18px}
.voice-tgl.on{color:var(--grn)} .voice-tgl.on .sw{background:var(--grn)}
.vsel{background:var(--glass);border:1px solid var(--gbd);border-radius:12px;padding:0 10px;height:37px;font-family:'Inter';font-size:12.5px;font-weight:600;color:var(--ink2);box-shadow:var(--sh1);cursor:pointer;max-width:170px;backdrop-filter:blur(8px);outline:none}
.search{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--gbd);border-radius:12px;padding:0 13px;height:40px;min-width:220px;box-shadow:var(--sh1);transition:.2s;backdrop-filter:blur(8px)}
.search:focus-within{box-shadow:var(--sh2)}
.search input{background:transparent;border:0;outline:0;color:var(--ink);font-family:'Inter';font-size:13.5px;font-weight:500;width:100%}
.search input::placeholder{color:var(--mut2)}

.err{background:linear-gradient(155deg,var(--ambS),var(--glass));border:1px solid rgba(240,145,13,.28);color:#96590A;font-size:12.5px;font-weight:600;padding:11px 15px;border-radius:14px;margin-bottom:18px;display:flex;align-items:center;gap:9px;animation:fadeIn .4s both;backdrop-filter:blur(10px);box-shadow:var(--sh1)}

/* ===== SECTION ===== */
.sec-h{display:flex;align-items:center;gap:11px;margin:6px 0 14px}
.sec-h h2{font-family:'Space Grotesk';font-weight:700;font-size:17px;letter-spacing:-.3px}
.sec-h .badge{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:20px;animation:pop .5s .12s both}
.sec-h .line{flex:1;height:1px;background:var(--gbd2)}
.sec-h .hint{font-size:12px;color:var(--mut);font-weight:500}

/* ===== RUNNING CARDS ===== */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;margin-bottom:30px}
.rcard{background:var(--glassS);border:1px solid var(--gbd);border-radius:18px;padding:17px;box-shadow:var(--sh2);position:relative;overflow:hidden;backdrop-filter:blur(16px);transition:transform .22s cubic-bezier(.34,1.2,.5,1),box-shadow .22s;animation:rise .5s both}
.rcard:hover{transform:translateY(-5px) scale(1.008);box-shadow:var(--sh3)}
.rcard.crit{border-color:rgba(230,74,84,.4);box-shadow:0 14px 36px rgba(230,74,84,.2)}
.rcard .stripe{position:absolute;top:0;left:0;right:0;height:3px}
.rc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rota{font-family:'Space Grotesk';font-weight:700;font-size:20px;letter-spacing:-.3px}
.rua-tag{font-family:'Space Grotesk';font-weight:700;font-size:13px;padding:5px 11px;border-radius:10px;background:rgba(26,29,41,.05);border:1px solid var(--gbd);color:var(--ink2)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(26,29,41,.05);border:1px solid var(--gbd);color:var(--mut)}
.pill.c-Severo{color:var(--sev);background:var(--redS);border-color:transparent}
.pill.c-Crítico{color:#C25E00;background:var(--ambS);border-color:transparent}
.pill.c-Atenção{color:var(--gold);background:rgba(214,162,9,.14);border-color:transparent}
.pill.c-Ótimo{color:var(--otm);background:var(--grnS);border-color:transparent}
.rep{font-size:12.5px;color:var(--mut);margin-top:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep b{color:var(--ink2);font-weight:600}
.rc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--gbd2)}
.ring-wrap{display:flex;align-items:center;gap:12px}
.ring{position:relative;width:66px;height:66px;flex-shrink:0}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rtrack{stroke:rgba(26,29,41,.09)} .ring .rprog{stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .4s}
.ring.crit svg{animation:ringGlow 1.7s infinite}
.ring .rin{position:absolute;inset:0;display:grid;place-items:center;font-family:'JetBrains Mono';font-weight:700;font-size:13px}
.rtxt .st{font-size:12px;font-weight:700} .rtxt .lab{font-size:11px;color:var(--mut2);margin-top:2px;font-weight:500}
.ok-c{color:var(--grn)} .warn-c{color:var(--amb)} .crit-c{color:var(--red)}
.spr{text-align:right} .spr .v{font-family:'Space Grotesk';font-weight:700;font-size:18px}
.spr .l{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-top:1px}

/* ===== DONE TABLE ===== */
.tbl{background:var(--glassS);border:1px solid var(--gbd);border-radius:18px;box-shadow:var(--sh2);overflow:hidden;backdrop-filter:blur(16px);animation:fadeUp .5s .05s both}
.thead,.trow{display:grid;grid-template-columns:90px 54px 50px 56px 1fr 116px 118px;align-items:center;gap:12px;padding:0 16px}
.thead{height:44px;border-bottom:1px solid var(--gbd2);background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0))}
.th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;transition:color .15s}

.rh-eye{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--red)}
.rh-main{font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:-.5px;margin-top:2px}

.rh-big{margin-left:auto;text-align:right}
.rh-big .n{font-family:'Space Grotesk';font-weight:700;font-size:48px;line-height:1;color:var(--red);letter-spacing:-2px}

.heat{background:var(--glassS);border:1px solid var(--gbd);border-radius:18px;padding:6px;box-shadow:var(--sh2);backdrop-filter:blur(16px);animation:fadeUp .5s .05s both}
.hrow{display:grid;grid-template-columns:34px 54px 1fr 60px 96px;align-items:center;gap:14px;padding:11px 14px;border-radius:12px;transition:background .12s;animation:fadeUp .35s both}

.hrow .pos{font-family:'Space Grotesk';font-weight:700;font-size:14px;color:var(--mut2);text-align:center}
.hrua{font-family:'Space Grotesk';font-weight:700;font-size:14px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(26,29,41,.14)}
.htrack{height:28px;background:rgba(26,29,41,.06);border-radius:9px;overflow:hidden;position:relative}

.hfill.top::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);background-size:250% 100%;animation:sheen 3s ease-in-out infinite}

.hsplit{font-size:11px;color:var(--mut2);font-weight:600;text-align:right;white-space:nowrap}

.rep-hero{background:linear-gradient(120deg,rgba(255,217,26,.18),var(--glassS));border:1px solid rgba(214,162,9,.32);border-radius:20px;padding:18px 22px;display:flex;align-items:center;gap:18px;margin-bottom:16px;box-shadow:var(--sh2);animation:rise .5s both;backdrop-filter:blur(16px)}

  gauge:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><path d="M12 14l4-4M20.5 15a9 9 0 10-17 0"/></svg>,
  alert2:<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>,
};

function App(){
  const [rec,setRec]=useState(()=>window.__FALLBACK__||[]);
  const [loadedAt,setLoadedAt]=useState(Date.now());
  const [now,setNow]=useState(Date.now());
  const [tab,setTab]=useState('live');
  const [ciclo,setCiclo]=useState('TODOS');
  const [q,setQ]=useState('');
  const [demo,setDemo]=useState(false);
  const [src,setSrc]=useState('snapshot local');
  const [err,setErr]=useState(false);
  const [sort,setSort]=useState({k:'tempo',d:-1});
  const [fetching,setFetching]=useState(false);
  const [lastSync,setLastSync]=useState(null);
  const [flash,setFlash]=useState({});
  const [voice,setVoice]=useState(false); const spokenRef=useRef(new Set());
  const [clips,setClips]=useState({antes:[],apos:[]}); const [showAudio,setShowAudio]=useState(false);
  const [voices,setVoices]=useState([]); const [voiceName,setVoiceName]=useState('');
  const voiceObjRef=useRef(null);
  const prevRef=useRef(null); const flashTO=useRef(0);
  const POLL=7000;

  useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t);},[]);
  useEffect(()=>{if(typeof window==='undefined'||!window.speechSynthesis)return;
    const ld=()=>{const vs=window.speechSynthesis.getVoices();setVoices(vs.filter(v=>/^pt/i.test(v.lang)));
      setVoiceName(p=>p||((vs.find(v=>/google/i.test(v.name)&&/^pt/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||{}).name||''));};
    ld();window.speechSynthesis.onvoiceschanged=ld;return()=>{try{window.speechSynthesis.onvoiceschanged=null;}catch(e){}};},[]);
  useEffect(()=>{_CLIPS=clips;},[clips]);
  useEffect(()=>{(async()=>{try{setClips(_regroup(await idbAll()));}catch(e){}})();},[]);
  const load=async()=>{setFetching(true);try{
    const res=await fetch(GVIZ+'&_='+Date.now(),{cache:'no-store'});if(!res.ok)throw 0;
    const data=mapRows(parseCSV(await res.text()));if(!data.length)throw 0;
    const prev=prevRef.current;
    if(prev){const pm={};prev.forEach(r=>pm[r.rota]=r);const fl={};
      data.forEach(r=>{const p=pm[r.rota];
        if(!p)fl[r.rota]='new';
        else if(!isDone(p.status)&&isDone(r.status))fl[r.rota]='done';
        else if(p.status!==r.status)fl[r.rota]='upd';
        else if(isDone(r.status)&&p.tempo!==r.tempo)fl[r.rota]='upd';});
      if(Object.keys(fl).length){setFlash(fl);clearTimeout(flashTO.current);flashTO.current=setTimeout(()=>setFlash({}),3600);}}
    prevRef.current=data;
    setRec(data);setLoadedAt(Date.now());setLastSync(Date.now());setSrc('planilha');setErr(false);
  }catch(e){setSrc('offline');setErr(true);}finally{setFetching(false);}};
  useEffect(()=>{load();const t=setInterval(load,POLL);return()=>clearInterval(t);},[]);
  useEffect(()=>{if(!voice)return;const S=spokenRef.current;
    running.forEach(r=>{const min=((now-loadedAt)+r.tempo*60000)/60000;const kw=r.rota+':w',ko=r.rota+':o';
      const det='Rota '+sayRota(r.rota)+', vaga '+(r.vaga||'não informada')+'.';
      if(min>=T_CRIT){if(!S.has(ko)){S.add(ko);S.add(kw);playAlert('apos',det,voiceObjRef.current);}}
      else if(min>=T_CRIT-5){if(!S.has(kw)){S.add(kw);playAlert('antes',det,voiceObjRef.current);}}
    });},[now,running,loadedAt,voice]);

  const records=useMemo(()=>{if(!demo)return rec;let n=0;
    return rec.map(r=>{if(n<6&&r.ciclo!=='SD'){n++;return{...r,status:'Em andamento'};}return r;});},[rec,demo]);
  const byC=r=>ciclo==='TODOS'||r.ciclo===ciclo;
  const byQ=r=>!q||(r.rota+' '+r.rep+' '+r.rua).toLowerCase().includes(q.toLowerCase());
  const filtered=useMemo(()=>records.filter(r=>byC(r)&&byQ(r)),[records,ciclo,q]);
  const running=useMemo(()=>filtered.filter(r=>isRun(r.status)).sort((a,b)=>b.tempo-a.tempo),[filtered]);
  const finished=useMemo(()=>filtered.filter(r=>!isRun(r.status)),[filtered]);
  const concl=useMemo(()=>finished.filter(r=>isDone(r.status)),[finished]);
  const doneSorted=useMemo(()=>{const {k,d}=sort;
    return [...finished].sort((a,b)=>{let A,B;
      if(k==='crit'){A=CRITORD[a.crit]||0;B=CRITORD[b.crit]||0;}
      else if(k==='tempo'){A=a.tempo;B=b.tempo;}
      else if(k==='vaga'){A=parseInt(a.vaga)||0;B=parseInt(b.vaga)||0;}
      else{A=(a[k]||'').toString().toLowerCase();B=(b[k]||'').toString().toLowerCase();}
      return A<B?-d:A>B?d:0;});},[finished,sort]);
  const cicloCount=c=>records.filter(r=>c==='TODOS'||r.ciclo===c).length;
  const avg=concl.length?Math.round(concl.reduce((s,r)=>s+r.tempo,0)/concl.length):0;
  const maxTempo=concl.length?Math.max(...concl.map(r=>r.tempo)):1;
  const critCount=filtered.filter(r=>r.crit==='Severo'||r.crit==='Crítico').length;

  const ranking=useMemo(()=>{const m={};
    filtered.forEach(r=>{if(!m[r.rua])m[r.rua]={rua:r.rua,total:0,done:0,run:0};m[r.rua].total++;isDone(r.status)?m[r.rua].done++:m[r.rua].run++;});
    return Object.values(m).sort((a,b)=>b.total-a.total);},[filtered]);
  const reps=useMemo(()=>{const m={};
    filtered.forEach(r=>{const k=r.rep||'—';if(!m[k])m[k]={rep:k,total:0,done:0,run:0};m[k].total++;isDone(r.status)?m[k].done++:m[k].run++;});
    return Object.values(m).sort((a,b)=>b.total-a.total);},[filtered]);

  const vT=useCountUp(filtered.length),vR=useCountUp(running.length),vD=useCountUp(concl.length),vA=useCountUp(avg),vC=useCountUp(critCount);
  const ago=lastSync?Math.max(0,Math.floor((now-lastSync)/1000)):null;
  const agoTxt=ago==null?'—':ago<2?'agora':ago<60?'há '+ago+'s':'há '+Math.floor(ago/60)+'min';
  voiceObjRef.current=voices.find(v=>v.name===voiceName)||null;
  const fk=ciclo+'|'+q+'|'+demo;
  const setSortK=k=>setSort(s=>s.k===k?{k,d:-s.d}:{k,d:k==='rota'||k==='rua'||k==='rep'?1:-1});
  const toggleVoice=()=>{const nv=!voice;setVoice(nv);try{
    if(nv){running.forEach(r=>{const min=((Date.now()-loadedAt)+r.tempo*60000)/60000;if(min>=T_CRIT-5)spokenRef.current.add(r.rota+':w');if(min>=T_CRIT)spokenRef.current.add(r.rota+':o');});enqueueSpeak('Alertas de voz ativados! Bora galera!',voiceObjRef.current);}
    else{stopVoiceQueue();}
  }catch(e){}};
  const reloadClips=async()=>{try{setClips(_regroup(await idbAll()));}catch(e){}};
  const addClips=async(cat,files)=>{for(const f of files){if(f&&f.type&&f.type.indexOf('audio')===0){try{await idbAdd(cat,f.name,f);}catch(e){}}}reloadClips();};
  const removeClip=async(id)=>{try{await idbDel(id);}catch(e){}reloadClips();};
  const isAudioName=n=>/\.(mp3|wav|ogg|m4a|aac)$/i.test(n||'');
  const catOf=p=>((p||'').toLowerCase().includes('antes')?'antes':'apos');
  const addBulk=async(files)=>{for(const f of files){const path=f.webkitRelativePath||f.name||'';const audio=(f.type&&f.type.indexOf('audio')===0)||isAudioName(f.name);if(!audio)continue;try{await idbAdd(catOf(path),f.name,f);}catch(e){}}reloadClips();};
  const addZip=async(file)=>{try{if(!window.JSZip){alert('Não consegui carregar o leitor de ZIP. Use a opção de pasta.');return;}const zip=await window.JSZip.loadAsync(file);for(const nm of Object.keys(zip.files)){const en=zip.files[nm];if(en.dir||!isAudioName(nm))continue;const blob=await en.async('blob');await idbAdd(catOf(nm),nm.split('/').pop(),blob);}reloadClips();}catch(e){alert('Erro ao ler o ZIP.');}};

  return(<div>
    <div className="aurora" aria-hidden="true"><span className="ab a1"></span><span className="ab a2"></span><span className="ab a3"></span><span className="ab a4"></span></div>
    <header className="topbar"><div className="wrap tb-in">
      <div className="logo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1B1B18" strokeWidth="2.3" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg></div>
      <div className="brand"><h1>Controle de Aduanas</h1><p>SMG1 · Expedição · tempo real</p></div>
      <div className="tb-right">
        <button className={'refresh'+(fetching?' spin':'')} onClick={load} title="Atualizar agora" aria-label="Atualizar agora">{Ic.refresh}</button>
        <span className={'src-tag'+(err?' off':'')}><span className={'livedot'+(err?' off':'')}></span>{err?'offline · reconectando':<span>ao vivo · <b>{agoTxt}</b></span>}</span>
        <span className="clock">{new Date(now).toLocaleTimeString('pt-BR')}</span>
      </div>
    </div></header>

    <main className="wrap">
      <div className="tabsrow">
        <div className="seg">
          <button className={tab==='live'?'on':''} onClick={()=>setTab('live')} style={{minWidth:116,justifyContent:'center'}}>{Ic.clock} Ao Vivo <span className="cnt">{running.length}</span></button>
          <button className={tab==='rank'?'on':''} onClick={()=>setTab('rank')} style={{minWidth:116,justifyContent:'center'}}>⚠ Carga por Rua <span className="cnt">{ranking.length}</span></button>
          <button className={tab==='rep'?'on':''} onClick={()=>setTab('rep')} style={{minWidth:116,justifyContent:'center'}}>👤 Por Representante <span className="cnt">{reps.length}</span></button>
        </div>
        <div className="grow"></div>
        <span className="upd">{Ic.clock} atualiza a cada {POLL/1000|0}s · muda na planilha, muda aqui</span>
      </div>

      <div className="stats">
        <div className="stat s-tot"><div className="sico">{Ic.box}</div><div className="slab">Total no filtro</div><div className="val gk">{vT}</div><div className="sub">{ciclo==='TODOS'?'todos os ciclos':'ciclo '+ciclo}</div></div>
        <div className="stat s-run"><div className="sico">{Ic.timer}</div><div className="slab">Em andamento</div><div className="val gk">{vR}</div><div className="sub">cronometrando agora</div></div>
        <div className="stat s-done"><div className="sico">{Ic.check}</div><div className="slab">Concluídas</div><div className="val gk">{vD}</div><div className="sub">finalizadas</div></div>
        <div className="stat s-avg"><div className="sico">{Ic.gauge}</div><div className="slab">Tempo médio</div><div className="val gk">{vA}<small>min</small></div><div className="sub">das concluídas</div></div>
        <div className="stat s-crit"><div className="sico">{Ic.alert2}</div><div className="slab">Criticidade alta</div><div className="val gk">{vC}</div><div className="sub">severo + crítico</div></div>
      </div>

      <div className="controls">
        <div className="cyc">
          <button className={'chip'+(ciclo==='TODOS'?' on':'')} onClick={()=>setCiclo('TODOS')}>TODOS<span className="n">{cicloCount('TODOS')}</span></button>
          {CICLOS.map(c=><button key={c} className={'chip'+(ciclo===c?' on':'')} onClick={()=>setCiclo(c)}>{c}<span className="n">{cicloCount(c)}</span></button>)}
        </div>
        <div className="spacer"></div>
        <button className="chip" onClick={()=>setShowAudio(true)} title="Subir os áudios dos alertas">🎵 Áudios<span className="n">{clips.antes.length+clips.apos.length}</span></button>
        <div className={'demo-tgl voice-tgl'+(voice?' on':'')} onClick={toggleVoice} title="Alertas de voz: avisa 5 min antes e ao estourar (30 min)"><span className="sw"></span> 🔊 Voz</div>
        {voice && voices.length>0 && <select className="vsel" value={voiceName} onChange={e=>setVoiceName(e.target.value)} title="Escolher voz">{voices.map(v=><option key={v.name} value={v.name}>{v.name.replace('Microsoft ','').replace('Google ','')}</option>)}</select>}
        <div className={'demo-tgl'+(demo?' on':'')} onClick={()=>setDemo(d=>!d)} title="Simula aduanas em andamento p/ ver o cronômetro"><span className="sw"></span> Modo demo</div>
        <div className="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#AFAFA6" strokeWidth="2.3" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input placeholder="Buscar rota, rua ou representante…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      </div>

      {err && <div className="err">{Ic.clock} Sem conexão com a planilha — exibindo o último snapshot salvo. Tenta reconectar sozinho a cada 7s.</div>}

      {tab==='live'
        ? <LiveView key={fk} running={running} done={doneSorted} now={now} loadedAt={loadedAt} maxTempo={maxTempo} sort={sort} setSortK={setSortK} flash={flash}/>
        : tab==='rank'
        ? <RuasView key={fk} ranking={ranking} ciclo={ciclo} total={filtered.length}/>
        : <RepView key={fk} reps={reps} ciclo={ciclo} total={filtered.length}/>}
    </main>
    {showAudio && <AudioManager clips={clips} onAdd={addClips} onRemove={removeClip} onBulk={addBulk} onZip={addZip} onClose={()=>setShowAudio(false)}/>}

    <footer className="foot wrap">
      O cronômetro sincroniza com a coluna <b>TEMPO</b> da planilha e conta em tempo real até o status virar <b>Concluída</b>.<br/>
      Verde até {T_WARN} min · laranja a partir de {T_WARN} · vermelho a partir de {T_CRIT}. Na aba de ruas, mais aduanas = mais carga (vermelho).<br/>
      🔊 Alertas de voz: aviso aos {T_CRIT-5} min (5 min antes) e ao estourar aos {T_CRIT} min — ative no botão "Voz" (o navegador pede um clique pra liberar o áudio).
    </footer>
  </div>);
}

function Ring({min,disp,t}){
  const R=28,C=2*Math.PI*R,off=C*(1-Math.min(min/SLA,1)),col=TONECOL[t];
  return(<div className={'ring '+(t==='crit'?'crit':'')}>
    <svg width="66" height="66" viewBox="0 0 66 66">
      <circle className="rtrack" cx="33" cy="33" r={R} fill="none" strokeWidth="6"/>
      <circle className="rprog" cx="33" cy="33" r={R} fill="none" strokeWidth="6" stroke={col} strokeDasharray={C} strokeDashoffset={off}/>
    </svg><div className="rin" style={{color:col}}>{disp}</div></div>);
}

const RunCard=memo(function RunCard({r,now,loadedAt,i}){
  const el=(now-loadedAt)+r.tempo*60000,min=el/60000,t=tone(min);
  return(<div className={'rcard '+(t==='crit'?'crit':'')} style={{animationDelay:Math.min(i,16)*35+'ms'}}>
    <div className="stripe" style={{background:CRITCOL[r.crit]||'var(--mut2)'}}></div>
    <div className="rc-top"><div><div className="rota">{r.rota}</div>
      <div className="meta"><span className="pill">{r.onda}</span>{r.crit&&<span className={'pill c-'+r.crit}>{r.crit}</span>}<span className="pill">{r.ciclo}</span></div></div>
      <span className="rua-tag">{r.rua}</span></div>
    <div className="rep">Rep: <b>{r.rep||'—'}</b></div>
    <div className="rc-foot"><div className="ring-wrap"><Ring min={min} disp={fmt(el)} t={t}/>
      <div className="rtxt"><div className={'st '+t+'-c'}><span className="livep"></span>Em andamento</div><div className="lab">meta {SLA} min</div></div></div>
      <div className="rstats"><div className="spr"><div className="v gk vgv">{r.vaga||'—'}</div><div className="l">Vaga</div></div><div className="spr"><div className="v gk">{r.spr||'—'}</div><div className="l">SPR</div></div></div></div>
  </div>);
});

const DoneRow=memo(function DoneRow({r,maxTempo,i,flash}){
  const t=tone(r.tempo); const canc=/cancel/i.test(r.status);
  return(<div className={"trow"+(canc?" canc":"")+(flash?" fl-"+flash:"")} style={{animationDelay:Math.min(i,24)*14+'ms'}}>
    <div className="td-rota">{r.rota}</div>
    <div className="td-rua">{r.rua}</div>
    <div className="td-onda">{r.onda}</div>
    <div className="td-vaga">{r.vaga?<span className="vgchip">{r.vaga}</span>:<span className="vgnone">—</span>}</div>
    <div className="td-rep">{r.rep||'—'}</div>
    <div className="td-crit"><span className="cdot" style={{background:CRITCOL[r.crit]||'var(--mut2)'}}></span>{r.crit||'—'}</div>
    <div className="td-tempo">
      {canc?<span className="canctag">Cancelada</span>:<React.Fragment><span className="tbar"><i style={{width:Math.max(8,(r.tempo/maxTempo)*100)+'%',background:TONECOL[t],animationDelay:Math.min(i,24)*14+'ms'}}></i></span><span className="tval gk">{r.tempo}<small> min</small></span></React.Fragment>}
    </div>
  </div>);
});

function SortH({k,label,sort,setSortK,right}){
  const on=sort.k===k;
  return(<div className={'th'+(right?' tr':'')} onClick={()=>setSortK(k)} style={on?{color:'var(--ink)'}:{}}>
    {label}<span className="ar">{on?(sort.d===1?'▲':'▼'):'⇅'}</span></div>);
}

function LiveView({running,done,now,loadedAt,maxTempo,sort,setSortK,flash}){
  return(<div className="view">
    {running.length>0 && <section>
      <div className="sec-h"><h2>Em andamento</h2><span className="badge" style={{background:'var(--ambS)',color:'#B8590A'}}>{running.length} cronometrando</span><div className="line"></div></div>
      <div className="rgrid">{running.map((r,i)=><RunCard key={r.id+r.rota} r={r} now={now} loadedAt={loadedAt} i={i}/>)}</div>
    </section>}
    <section>
      <div className="sec-h"><h2>Finalizadas</h2><span className="badge" style={{background:'var(--grnS)',color:'var(--grn)'}}>{done.length}</span><span className="hint">clique nas colunas p/ ordenar</span><div className="line"></div></div>
      {done.length===0
        ? <div className="empty">{running.length===0?'Nenhuma aduana encontrada neste filtro.':'Nenhuma concluída neste filtro ainda.'}</div>
        : <div className="tbl">
            <div className="thead">
              <SortH k="rota" label="Rota" sort={sort} setSortK={setSortK}/>
              <SortH k="rua" label="Rua" sort={sort} setSortK={setSortK}/>
              <SortH k="onda" label="Onda" sort={sort} setSortK={setSortK}/>
              <SortH k="vaga" label="Vaga" sort={sort} setSortK={setSortK}/>
              <SortH k="rep" label="Representante" sort={sort} setSortK={setSortK}/>
              <SortH k="crit" label="Criticidade" sort={sort} setSortK={setSortK}/>
              <SortH k="tempo" label="Tempo" sort={sort} setSortK={setSortK} right/>
            </div>
            {done.map((r,i)=><DoneRow key={r.id+r.rota} r={r} maxTempo={maxTempo} i={i} flash={flash[r.rota]||''}/>)}
          </div>}
    </section>
  </div>);
}

function RuasView({ranking,ciclo,total}){
  const top=ranking[0]||{rua:'',total:0,done:0,run:0};
  const heroN=useCountUp(top.total);
  if(!ranking.length)return<div className="empty">Sem dados de ruas neste filtro.</div>;
  const max=ranking[0].total;
  const tie=ranking.filter(r=>r.total===max).map(r=>r.rua);
  const pct=total?Math.round(top.total/total*100):0;
  return(<div className="view">
    <div className="ruas-hero">
      <div className="ico">{Ic.alert}</div>
      <div>
        <div className="rh-eye">Maior carga {ciclo!=='TODOS'?'· ciclo '+ciclo:''}</div>
        <div className="rh-main">Rua <b>{tie.length>1?tie.join(' e '):top.rua}</b> {tie.length>1?'estão':'está'} sobrecarregada{tie.length>1?'s':''}</div>
        <div className="rh-sub">{top.total} aduanas · concentra {pct}% do volume do filtro · {top.run} ainda ativas</div>
      </div>
      <div className="rh-big"><div className="n gk">{heroN}</div><div className="l">aduanas</div></div>
    </div>

    <div className="legend">
      <span style={{fontWeight:600,color:'var(--ink2)'}}>Nível de carga:</span>
      <span className="it"><span className="sw2" style={{background:'#1A9A5A'}}></span>tranquila</span>
      <span className="it"><span className="sw2" style={{background:'#D99A0A'}}></span>média</span>
      <span className="it"><span className="sw2" style={{background:'#E6771C'}}></span>alta</span>
      <span className="it"><span className="sw2" style={{background:'#DE4A55'}}></span>crítica</span>
      <span style={{marginLeft:'auto',color:'var(--mut2)'}}>quanto mais aduanas, pior</span>
    </div>

    <div className="heat">{ranking.map((r,i)=>{const lv=loadLevel(r.total/max);
      return(<div key={r.rua} className="hrow" style={{animationDelay:Math.min(i,20)*28+'ms'}}>
        <div className="pos">{i+1}</div>
        <div className="hrua" style={{background:lv.c}}>{r.rua}</div>
        <div className="htrack"><div className={'hfill'+(r.total===max?' top':'')} style={{width:Math.max(14,(r.total/max)*100)+'%',background:lv.c,animationDelay:Math.min(i,20)*38+'ms'}}><span className="lvl">{lv.t}</span></div></div>
        <div className="hnum gk" style={{color:lv.c}}>{r.total}</div>
        <div className="hsplit">{r.done} concl · {r.run} ativas</div>
      </div>);})}</div>
  </div>);
}

const AVCOL=['#3B7BFF','#14A85C','#F0910D','#9B6BFF','#E64A54','#0EA5A5','#D6A209','#E6559E'];
function avColor(n){let h=0;for(let i=0;i<(n||'').length;i++)h=(h*31+n.charCodeAt(i))>>>0;return AVCOL[h%AVCOL.length];}
function initials(n){const p=(n||'').trim().split(/\s+/);return (((p[0]||'')[0]||'?')+((p.length>1?p[p.length-1][0]:'')||'')).toUpperCase();}

function RepView({reps,ciclo,total}){
  const top=reps[0]||{rep:'',total:0,done:0,run:0};
  const topN=useCountUp(top.total);
  if(!reps.length)return<div className="empty">Sem dados de representantes neste filtro.</div>;
  const max=reps[0].total;
  return(<div className="view">
    <div className="rep-hero">
      <div className="av big" style={{background:avColor(top.rep)}}>{initials(top.rep)}</div>
      <div>
        <div className="rh-eye" style={{color:'var(--gold)'}}>⭐ Destaque {ciclo!=='TODOS'?'· ciclo '+ciclo:''}</div>
        <div className="rh-main">{top.rep}</div>
        <div className="rh-sub">{top.total} aduanas · {top.done} concluídas · {top.run} ativas</div>
      </div>
      <div className="rh-big"><div className="n gk" style={{color:'var(--gold)'}}>{topN}</div><div className="l">aduanas</div></div>
    </div>
    <div className="sec-h"><h2>Aduanas por representante</h2><span className="badge" style={{background:'var(--bluS)',color:'var(--blu)'}}>{reps.length}</span><span className="hint">quanto mais, mais produtivo</span><div className="line"></div></div>
    <div className="rlist">{reps.map((r,i)=>(
      <div key={r.rep} className={'rrow'+(i===0?' top':'')} style={{animationDelay:Math.min(i,24)*22+'ms'}}>
        <div className="pos">{i+1}</div>
        <div className="av" style={{background:avColor(r.rep)}}>{initials(r.rep)}</div>
        <div className="rname">{r.rep}</div>
        <div className="rtrack2"><div className="rfill" style={{width:Math.max(6,(r.total/max)*100)+'%',animationDelay:Math.min(i,24)*30+'ms'}}></div></div>
        <div className="rnum gk">{r.total}</div>
        <div className="rsplit">{r.done} concl · {r.run} ativas</div>
      </div>))}</div>
  </div>);
}

function AudioCat({title,cat,list,onAdd,onRemove}){
  const ref=useRef(null);
  return(<div className="acat">
    <div className="acat-h">{title}<span className="acat-n">{list.length}</span></div>
    <div className="drop" onClick={()=>ref.current&&ref.current.click()} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();onAdd(cat,e.dataTransfer.files);}}>
      <input ref={ref} type="file" accept="audio/*" multiple style={{display:'none'}} onChange={e=>{onAdd(cat,e.target.files);e.target.value='';}}/>
      + arraste ou clique pra adicionar áudios
    </div>
    <div className="clip-list">
      {list.length===0 && <div className="clip-empty">nenhum áudio ainda</div>}
      {list.map(c=>(<div key={c.id} className="clip-row">
        <button className="clip-play" onClick={()=>{try{new Audio(c.url).play();}catch(e){}}}>▶</button>
        <span className="clip-name">{c.name}</span>
        <button className="clip-del" onClick={()=>onRemove(c.id)}>✕</button>
      </div>))}
    </div>
  </div>);
}
function AudioManager({clips,onAdd,onRemove,onBulk,onZip,onClose}){
  const dirRef=useRef(null), zipRef=useRef(null);
  useEffect(()=>{if(dirRef.current){dirRef.current.setAttribute('webkitdirectory','');dirRef.current.setAttribute('directory','');dirRef.current.setAttribute('mozdirectory','');}},[]);
  return(<div className="modal-bg" onClick={onClose}>
    <div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="modal-h"><h3>🎵 Áudios dos alertas</h3><button className="x" onClick={onClose}>✕</button></div>
      <p className="modal-sub">Suba os áudios que vão ser sorteados e tocados. Depois, a voz normal fala a rota e a vaga. Ficam salvos neste navegador — não precisa subir nada pro GitHub.</p>
      <div className="bulk">
        <div className="bulk-t">⚡ Subir em massa</div>
        <div className="bulk-btns">
          <button className="bulk-b" onClick={()=>dirRef.current&&dirRef.current.click()}>📁 Escolher pasta</button>
          <button className="bulk-b" onClick={()=>zipRef.current&&zipRef.current.click()}>🗜️ Escolher ZIP</button>
          <input ref={dirRef} type="file" multiple style={{display:'none'}} onChange={e=>{onBulk(e.target.files);e.target.value='';}}/>
          <input ref={zipRef} type="file" accept=".zip" style={{display:'none'}} onChange={e=>{if(e.target.files[0])onZip(e.target.files[0]);e.target.value='';}}/>
        </div>
        <div className="bulk-hint">Separa sozinho pelas subpastas <b>"antes de estourar"</b> e <b>"após estourar"</b>. Pode jogar o seu <b>Falas.zip</b> direto aqui.</div>
      </div>
      <div className="acol2">
        <AudioCat title="Antes de estourar (5 min)" cat="antes" list={clips.antes} onAdd={onAdd} onRemove={onRemove}/>
        <AudioCat title="Após estourar" cat="apos" list={clips.apos} onAdd={onAdd} onRemove={onRemove}/>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
